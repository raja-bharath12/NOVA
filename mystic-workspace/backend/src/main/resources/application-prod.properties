# ===== AWS RDS PostgreSQL Database (Production) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://database-1.c7ey60g2wfh6.ap-south-1.rds.amazonaws.com:5432/postgres?sslmode=require}
