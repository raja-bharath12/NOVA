# ===== Server =====
server.port=8080

# ===== Active Profiles =====
# Defaults to 'local' for instant zero-setup local development (runs with local database)
# When deploying to AWS EC2 with RDS, pass SPRING_PROFILES_ACTIVE=prod or set SPRING_DATASOURCE_PASSWORD
spring.profiles.default=local

# ===== AWS RDS PostgreSQL Database (Production) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://database-1.c7ey60g2wfh6.ap-south-1.rds.amazonaws.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== JWT =====
# Change this secret before deploying to production. Must be 256+ bits for HS256.
app.jwt.secret=mystic-workspace-super-secret-key-change-me-before-production-0123456789
app.jwt.expiration-ms=86400000

# ===== CORS =====
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app,http://localhost:3000,*}

# ===== Multipart File Upload =====
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===== Storage Configuration =====
# Options: 'local' (default for local dev) or 's3' (AWS S3)
app.storage.type=local
app.storage.local-dir=./uploads

# AWS S3 Settings (used when app.storage.type=s3)
aws.s3.bucket=mystic-workspace-bucket
aws.s3.region=us-east-1
aws.s3.access-key=
aws.s3.secret-key=

# ===== LIVEKIT CLOUD =====
livekit.api.url=${LIVEKIT_URL:wss://nova-fawy0jmi.livekit.cloud}
livekit.api.key=${LIVEKIT_API_KEY:APIPVnJzdseSC2P}
livekit.api.secret=${LIVEKIT_API_SECRET:2o93DHX0FeBy6K1nGORTTxHw6mw8HbBvlMCpQaBGJcO}
